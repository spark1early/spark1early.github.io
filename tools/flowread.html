<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowRead v1.8 — spark1early.github.io</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --bg2: #111111;
  --bg3: #181818;
  --fg: #f0f0f0;
  --fg2: #999999;
  --red: #cc0000;
  --red2: #ff2222;
  --border: #222222;
  --border2: #2a2a2a;
  --gold: #c8a84b;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Instrument Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.96);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--fg);
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.logo span { color: var(--red); }
.logo sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--fg2);
  font-weight: 400;
  vertical-align: baseline;
}

.header-links {
  display: flex;
  gap: 24px;
  align-items: center;
}

.header-links a {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg2);
  text-decoration: none;
  transition: color 0.2s;
}

.header-links a:hover { color: var(--red); }

.tagline {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg2);
}

/* ── MAIN ── */
.main {
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── STAGE ── */
.reader-stage {
  position: relative;
  background: var(--bg2);
  border: 1px solid var(--border);
  height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.reader-stage::after {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 100%;
  background: linear-gradient(to bottom, transparent, rgba(204,0,0,0.15), transparent);
  pointer-events: none;
}

.stage-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(204,0,0,0.06) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.reader-stage.playing .stage-glow { opacity: 1; }

.music-label {
  position: absolute;
  top: 12px;
  left: 16px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg2);
}

.version-tag {
  position: absolute;
  top: 12px;
  right: 16px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--border2);
}

/* EQ VIZ */
.music-viz {
  position: absolute;
  bottom: 28px;
  right: 16px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
}

.bar {
  width: 2px;
  background: var(--red);
  opacity: 0.5;
  height: 3px;
  transition: height 0.08s ease;
}

/* WORD DISPLAY */
.word-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.4rem, 7vw, 3rem);
  letter-spacing: 0.05em;
  color: var(--fg);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0 24px;
  z-index: 1;
  min-height: 3.5rem;
}

.word-wrap {
  display: flex;
  align-items: baseline;
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
}

.before { text-align: right; flex: 1; min-width: 0; }
.after  { text-align: left;  flex: 1; min-width: 0; }

.orp {
  color: var(--red);
  position: relative;
  flex-shrink: 0;
}

.orp::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0; right: 0;
  height: 2px;
  background: var(--red);
  opacity: 0.6;
}

.idle-text {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  color: var(--fg2);
  text-transform: uppercase;
}

/* PROGRESS */
.progress-info {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--fg2);
  white-space: nowrap;
}

.progress-bar-wrap {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--border);
}

.progress-bar {
  height: 100%;
  background: var(--red);
  width: 0%;
  transition: width 0.1s linear;
}

/* ── CONTROLS ── */
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover { border-color: var(--red); color: var(--red); }

.btn-primary {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
  font-weight: 500;
  padding: 8px 28px;
}

.btn-primary:hover { background: var(--red2); border-color: var(--red2); color: #fff; }

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--border);
}

/* ── SLIDERS ── */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.setting-block { display: flex; flex-direction: column; gap: 8px; }

.setting-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg2);
}

.slider-row { display: flex; align-items: center; gap: 12px; }

input[type=range] {
  -webkit-appearance: none;
  flex: 1;
  height: 1px;
  background: var(--border2);
  outline: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--red);
  cursor: pointer;
  border: none;
}

.slider-val {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--red);
  min-width: 52px;
  text-align: right;
}

/* ── GENRE PILLS ── */
.genre-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.genre-pill {
  padding: 5px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.genre-pill:hover { border-color: var(--fg2); color: var(--fg); }
.genre-pill.active { background: var(--red); color: #fff; border-color: var(--red); }

/* ── TEXT INPUT ── */
.input-section { display: flex; flex-direction: column; gap: 10px; }

textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.875rem;
  padding: 14px 16px;
  resize: vertical;
  min-height: 110px;
  outline: none;
  line-height: 1.7;
  transition: border-color 0.2s;
}

textarea:focus { border-color: var(--border2); }
textarea::placeholder { color: var(--fg2); font-size: 0.8rem; }

/* ── LOAD SECTION ── */
.load-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.load-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.load-pill {
  padding: 5px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.load-pill:hover { border-color: var(--fg2); color: var(--fg); }
.load-pill.active { border-color: var(--red); color: var(--red); }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  header { padding: 0 16px; }
  .tagline { display: none; }
  .settings-grid { grid-template-columns: 1fr; }
  .header-links a:not(:first-child) { display: none; }
}

/* ── SECTION NAV ── */
.section-nav {

.section-nav-label {

.section-btn {

  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg2);
  cursor: pointer;

  transition: all 0.2s;

  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
  border-bottom: 2px solid transparent;

.section-btn:hover { color: var(--fg); background: var(--bg3); }
.section-btn.active { color: var(--red); border-bottom-color: var(--red); background: var(--bg3); }
.sec-words { font-size: 8px; color: var(--fg2); opacity: 0.5; }

</style>
</head>

// ─── AUDIO CONTEXT ───────────────────────────────────────────
const AudioContext = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let masterGain = null;

function initAudio() {
  if (!ctx) {
    ctx = new AudioContext();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.45;
    masterGain.connect(ctx.destination);

}

function loadSection(text) {
  words = text.split(/\s+/).filter(w => w.length > 0);
  wordIndex = 0;
  if (isPlaying) {
    isPlaying = false;
    clearTimeout(readTimer);
    stopMusic();
    const pb = document.getElementById('playBtn');
    pb.innerHTML = '▶ PLAY';
    pb.classList.remove('playing');
  }
  updateCountDisplay();
  showWord(words[0] || '');
  document.getElementById('progressBar').style.width = '0%';
}

(function buildSectionNav() {

    btn.onclick = () => {
      document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

    nav.appendChild(btn);

  const allBtn = document.createElement('button');

})();

// ─── BPM / LOOP TABLES ───────────────────────────────────────
const LOOP_BPMS = {
  ambient:     [108, 105, 120],
  electrowave: [120, 75,  90],
  jazz:        [100, 100, 129],
  orchestral:  [115, 135, 120],
  piano:       [115, 104, 120],
  lofi:        [95,  90,  90]
};

const LOOP_FILES = {
  ambient:     ['ambient1.mp3',     'ambient2.mp3',     'ambient3.mp3'],
  electrowave: ['electrowave1.mp3', 'electrowave2.mp3', 'electrowave3.mp3'],
  jazz:        ['jazz1.mp3',        'jazz2.mp3',        'jazz3.mp3'],
  orchestral:  ['orchestral1.mp3',  'orchestral2.mp3',  'orchestral3.mp3'],
  piano:       ['piano1.mp3',       'piano2.mp3',       'piano3.mp3'],
  lofi:        ['lofi1.mp3',        'lofi2.mp3',        'lofi3.mp3']
};

};

// ─── AUDIO LOOP ENGINE ───────────────────────────────────────
let audioCache = {};
let loopSource = null;
let loopGain = null;

async function loadLoop(genre, idx) {
  const key = genre + idx;
  if (audioCache[key]) return audioCache[key];
  const file = LOOP_FILES[genre][idx];
  const url = `../flowread-loops/${genre}/${file}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('missing');
    const buf = await resp.arrayBuffer();
    const decoded = await ctx.decodeAudioData(buf);
    audioCache[key] = decoded;
    return decoded;
  } catch(e) {
    console.warn('FlowRead: loop not found, using synthesis:', url);
    return null;
  }
}

async function playLoop(genre, idx) {
  stopLoop();
  const buf = await loadLoop(genre, idx);
  if (!buf) return;
  loopGain = ctx.createGain();
  loopGain.gain.value = 0.55;
  loopGain.connect(masterGain);
  loopSource = ctx.createBufferSource();
  loopSource.buffer = buf;
  loopSource.loop = true;
  loopSource.playbackRate.value = wpmToBPM(wpm) / LOOP_BPMS[genre][idx];
  loopSource.connect(loopGain);
  loopSource.start(0);
}

function stopLoop() {
  if (loopSource) { try { loopSource.stop(); } catch(e) {} loopSource = null; }
  if (loopGain)   { loopGain.disconnect(); loopGain = null; }
}

function updateLoopRate() {
  if (!loopSource || !LOOP_BPMS[currentGenre]) return;
  loopSource.playbackRate.value = wpmToBPM(wpm) / LOOP_BPMS[currentGenre][currentTrack];
}

// ─── SYNTHESIS FALLBACK ──────────────────────────────────────
const SCALES = {
  jazz:        [60,62,63,65,67,69,70,72,74,75],
  orchestral:  [60,62,64,65,67,69,71,72,74,76],
  lofi:        [60,63,65,67,70,72,75,77],
  piano:       [60,62,64,67,69,72,74,76,79,81],
  ambient:     [60,62,64,66,69,71,73,76],
  electrowave: [60,63,67,70,72,75,79,82]
};

function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function playNote(freq, t, dur, type='sine', vol=0.1) {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}

function playKick(t) {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.2);
}

function playSnare(t) {
  if (!ctx) return;
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 1000;
  g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t + 0.1);
}

function playHihat(t, vol=0.07) {
  if (!ctx) return;
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 8000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t + 0.06);
}

function scheduleSynthBeat() {
  if (!ctx || currentGenre === 'none') return;
  const bd = 60 / wpmToBPM(wpm);
  const now = ctx.currentTime + 0.05;
  const sc = SCALES[currentGenre];

  if (['lofi','jazz','electrowave'].includes(currentGenre)) {
    playKick(now); playHihat(now + bd * 0.5); playSnare(now + bd); playHihat(now + bd * 1.5, 0.04);
  }
  if (currentGenre === 'jazz') {
    const chord = [sc[0],sc[3],sc[5],sc[7]];
    chord.forEach((n,i) => playNote(midi(n-12), now + i*bd*0.4, bd*0.35, 'triangle', 0.07));
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]), now+bd*0.5, bd*0.6, 'sine', 0.09);
  }
  if (currentGenre === 'orchestral') {
    [sc[0],sc[2],sc[4]].forEach((n,i) => playNote(midi(n-12), now+i*0.03, bd*1.8, 'sine', 0.055));
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]+12), now+bd*0.5, bd*0.9, 'sine', 0.09);
    playNote(midi(sc[0]-24), now, bd*2, 'triangle', 0.11);
  }
  if (currentGenre === 'lofi') {
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]-12), now, bd*1.2, 'triangle', 0.06);
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]), now+bd*0.75, bd*0.5, 'sine', 0.05);
  }
  if (currentGenre === 'piano') {
    const inv = [[0,2,4],[0,3,5],[0,2,5]][currentTrack];
    inv.forEach((idx,i) => playNote(midi(sc[idx%sc.length]), now+i*bd*0.3, bd*0.9, 'sine', 0.08));
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]+12), now+bd*0.5, bd*0.6, 'sine', 0.06);
    playNote(midi(sc[0]-12), now, bd*1.5, 'triangle', 0.05);
  }
  if (currentGenre === 'ambient') {
    [sc[0],sc[2],sc[4],sc[6]].forEach((n,i) => playNote(midi(n-12), now+i*0.08, bd*3.5, 'sine', 0.035));
    if (Math.random() > 0.5) playNote(midi(sc[Math.floor(Math.random()*sc.length)]+12), now+bd, bd*1.5, 'sine', 0.025);
    playNote(midi(sc[0]-24), now, bd*4, 'triangle', 0.05);
  }
  if (currentGenre === 'electrowave') {
    playKick(now); playKick(now+bd); playHihat(now+bd*0.5,0.05); playHihat(now+bd*1.5,0.035);
    playNote(midi(sc[currentTrack%sc.length]-12), now, bd*0.8, 'sawtooth', 0.06);
    playNote(midi(sc[(currentTrack+2)%sc.length]-12), now+bd*0.5, bd*0.8, 'sawtooth', 0.05);
    playNote(midi(sc[Math.floor(Math.random()*sc.length)]), now+bd*0.25, bd*0.4, 'square', 0.04);
  }
}

function wpmToBPM(w) { return Math.max(60, Math.min(200, w * 0.38)); }

// ─── MUSIC START/STOP ────────────────────────────────────────
function startMusic() {
  if (currentGenre === 'none') return;
  initAudio();
  currentTrack = Math.floor(Math.random() * 3);
  if (LOOP_FILES[currentGenre]) {
    playLoop(currentGenre, currentTrack);
  }
  const beatMs = (60 / wpmToBPM(wpm)) * 1000;
  if (!LOOP_FILES[currentGenre]) scheduleSynthBeat();
  bpmInterval = setInterval(() => {
    if (isPlaying && currentGenre !== 'none' && !LOOP_FILES[currentGenre]) scheduleSynthBeat();
  }, beatMs * 2);
}

function stopMusic() {
  if (bpmInterval) { clearInterval(bpmInterval); bpmInterval = null; }
  stopLoop();
}

function restartMusic() { stopMusic(); if (isPlaying && currentGenre !== 'none') startMusic(); }

// ─── VIZ ─────────────────────────────────────────────────────
function animateViz() {
  if (!isPlaying || currentGenre === 'none') {
    document.querySelectorAll('.bar').forEach(b => b.style.height = '3px');
    return;
  }
  const bars = document.querySelectorAll('.bar');
  const bd = (60 / wpmToBPM(wpm)) * 1000;
  const t = (Date.now() % bd) / bd;
  bars.forEach((b, i) => {
    const h = 3 + Math.abs(Math.sin(t * Math.PI * 2 + i * 0.7)) * 13;
    b.style.height = Math.round(h) + 'px';
  });
  requestAnimationFrame(animateViz);
}

// ─── PUNCTUATION PACING ───────────────────────────────────────
function getPauseMult(word) {
  const base = 60000 / wpm;
  if (/\.\.\./.test(word) || word === '…')          return base * 3.2;
  if (/[.!?]$/.test(word))                           return base * 2.8;
  if (/[—:–]$/.test(word))                           return base * 2.0;
  if (/;$/.test(word))                               return base * 1.8;
  if (/[,)\]'"\u2019\u201d]$/.test(word))            return base * 1.4;
  if (/^[(\["'\u2018\u201c]/.test(word))             return base * 1.2;
  if (/[a-zA-Z][0-9]|[0-9][a-zA-Z]/.test(word))     return base * 1.1;
  if (word.length >= 10)                             return base * 1.15;
  if (/-/.test(word))                                return base * 0.9;
  return base;
}

// ─── ORP ─────────────────────────────────────────────────────
function getORP(word) {
  if (word.length <= 1) return 0;
  if (word.length <= 5) return 1;
  if (word.length <= 9) return 2;
  return 3;
}

function showWord(word) {
  if (!word) return;
  const i = getORP(word);
  document.getElementById('wordDisplay').innerHTML =
    `<div class="word-wrap"><span class="before">${word.slice(0,i)}</span><span class="orp">${word.slice(i,i+1)}</span><span class="after">${word.slice(i+1)}</span></div>`;
}

// ─── READING ENGINE ───────────────────────────────────────────
function startReading() {
  clearTimeout(timer);
  function tick() {
    if (!isPlaying) return;
    if (wordIndex >= words.length) {
      stopMusic(); isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ PLAY';
      document.getElementById('stage').classList.remove('playing');
      document.getElementById('wordDisplay').innerHTML = '<span class="idle-text">Done — restart to re-read</span>';
      return;
    }
    const word = words[wordIndex];
    showWord(word);
    wordIndex++;
    updateCountDisplay();
    timer = setTimeout(tick, getPauseMult(word));
  }
  tick();
}

// ─── CONTROLS ────────────────────────────────────────────────
function togglePlay() {
  if (!words.length) loadText();
  if (!words.length) return;
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  const stage = document.getElementById('stage');
  if (isPlaying) {
    btn.textContent = '⏸ PAUSE';
    stage.classList.add('playing');
    if (ctx) ctx.resume();
    startReading();
    startMusic();
    animateViz();
  } else {
    btn.textContent = '▶ PLAY';
    stage.classList.remove('playing');
    clearTimeout(timer);
    stopMusic();
  }
}

function restartReader() {
  clearTimeout(timer); stopMusic(); isPlaying = false;
  wordIndex = 0;
  document.getElementById('playBtn').textContent = '▶ PLAY';
  document.getElementById('stage').classList.remove('playing');
  if (words.length) { showWord(words[0]); updateCountDisplay(); }
  else document.getElementById('wordDisplay').innerHTML = '<span class="idle-text">Select a section above or paste text below</span>';
}

function skipBack() { wordIndex = Math.max(0, wordIndex - 10); if (words.length) showWord(words[wordIndex]); updateCountDisplay(); }
function skipFwd()  { wordIndex = Math.min(words.length - 1, wordIndex + 10); if (words.length) showWord(words[wordIndex]); updateCountDisplay(); }

function updateWPM(val) {
  wpm = parseInt(val);
  document.getElementById('wpmVal').textContent = wpm + ' WPM';
  updateCountDisplay();
  if (isPlaying) { startReading(); updateLoopRate(); restartMusic(); }
}

function updateFont(val) {
  const v = parseFloat(val);
  document.getElementById('fontVal').textContent = v.toFixed(1) + 'rem';
  document.getElementById('wordDisplay').style.fontSize = v + 'rem';
  document.getElementById('fontSlider').value = v;
}

function setGenre(genre, el) {
  currentGenre = genre;
  document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('musicLabel').textContent = GENRE_LABELS[genre];
  if (isPlaying) { stopMusic(); if (genre !== 'none') startMusic(); }
}

function loadText() {
  const raw = document.getElementById('textInput').value.trim();
  if (!raw) return;
  words = raw.split(/\s+/).filter(w => w.length > 0);
  wordIndex = 0;
  updateCountDisplay();
  showWord(words[0] || '');
  document.getElementById('progressBar').style.width = '0%';
}

function updateCountDisplay() {
  const total = words.length;
  const remaining = total - wordIndex;
  const secs = Math.round((remaining / wpm) * 60);
  document.getElementById('wordCount').textContent = `${wordIndex} / ${total} words`;
  document.getElementById('wpmDisplay').textContent = `${wpm} WPM`;
  document.getElementById('timeLeft').textContent = secs < 60 ? `${secs}s remaining` : `${Math.ceil(secs/60)}m remaining`;
  document.getElementById('progressBar').style.width = total > 0 ? ((wordIndex/total)*100).toFixed(1)+'%' : '0%';
}

// ─── INIT ─────────────────────────────────────────────────────
updateCountDisplay();
</script>
</body>
